# Configuration de PRODUCTION (Render). Activée par la variable SPRING_PROFILES_ACTIVE=prod (Dockerfile).
# Aucun secret ici : chaque ${VARIABLE} est renseignée dans l'onglet "Environment" du service Render.
# Accents : écrits en code \uXXXX (Spring lit ce fichier en ISO-8859-1)

# L'hébergeur impose le port d'écoute via la variable PORT
server.port=${PORT:8080}

# Base PostgreSQL de l'hébergeur
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jeton de connexion (clé à générer avec : openssl rand -base64 32) ; session de 24 h
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Adresse du site Vercel (plusieurs valeurs séparées par des virgules)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Images : stockées dans la base de données (table "media"). Ce dossier ne sert qu'à importer
# d'anciennes images au démarrage ; il n'existe pas sur l'hébergeur.
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Premier compte administrateur, créé au démarrage SEULEMENT si aucun ADMIN n'existe
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Valeurs de départ du footer (utilisées une seule fois, quand la table parametre_site est vide)
app.site.nom=D\u00e9p\u00eache 226
app.site.slogan=Le Burkina Faso racont\u00e9 par ses journalistes. Information v\u00e9rifi\u00e9e, terrain d'abord.
app.site.email-contact=redaction@depeche226.bf
app.site.telephone=+226 25 30 12 26
app.site.adresse=Avenue Kwame N'Krumah
app.site.ville=Ouagadougou, Burkina Faso
app.site.mention-edition=\u00c9dit\u00e9 \u00e0 Ouagadougou \u00b7 ISSN 2226-0226

# E-mails (Brevo). Port 587 par défaut ; si l'hébergeur le bloque, SPRING_MAIL_PORT=2525 (aussi accepté par Brevo)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
app.mail.expediteur=${APP_MAIL_EXPEDITEUR}
app.mail.nom-expediteur=D\u00e9p\u00eache 226

# Adresse publique du site (liens des e-mails : mot de passe oublié, newsletter)
app.site.url=${APP_SITE_URL}
