# Configuration de PRODUCTION (Railway). Activée par la variable SPRING_PROFILES_ACTIVE=prod.
# Aucun secret ici : chaque ${VARIABLE} est renseignée dans l'onglet "Variables" du service Railway.

# Railway impose le port d'écoute via la variable PORT
server.port=${PORT:8080}

# Base PostgreSQL de Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Jeton de connexion (clé à générer avec : openssl rand -base64 32) ; session de 24 h
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Adresse du site Vercel (plusieurs valeurs séparées par des virgules)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Images : dossier du Volume Railway, sinon elles sont perdues à chaque redéploiement
app.upload.dir=${APP_UPLOAD_DIR:/data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Premier compte administrateur, créé au démarrage SEULEMENT si aucun ADMIN n'existe
app.admin.email=${APP_ADMIN_EMAIL}
app.admin.password=${APP_ADMIN_PASSWORD}

# Valeurs de départ du footer (utilisées une seule fois, quand la table parametre_site est vide)
app.site.nom=Dépêche 226
app.site.slogan=Le Burkina Faso raconté par ses journalistes. Information vérifiée, terrain d'abord.
app.site.email-contact=redaction@depeche226.bf
app.site.telephone=+226 25 30 12 26
app.site.adresse=Avenue Kwame N'Krumah
app.site.ville=Ouagadougou, Burkina Faso
app.site.mention-edition=Édité à Ouagadougou · ISSN 2226-0226

# E-mails (Brevo)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
app.mail.expediteur=${APP_MAIL_EXPEDITEUR}
app.mail.nom-expediteur=Dépêche 226

# Adresse publique du site (liens des e-mails : mot de passe oublié, newsletter)
app.site.url=${APP_SITE_URL}
