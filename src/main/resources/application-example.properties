# Port du serveur (Change-le si le port est d�j� utilis� sur ta machine)
server.port=8080
# Configuration Base de données (Remplace par tes vraies infos en local)
spring.datasource.url=jdbc:postgresql://localhost:5432/depeche_infos
spring.datasource.username=ton_user
spring.datasource.password=TON_MOT_DE_PASSE
spring.jpa.hibernate.ddl-auto=update

# Configuration Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# pour generer la cle secrete utiliser cette commande dans git bash :  openssl rand -base64 32
jwt.secret=
jwt.expiration=

# ===== Ajouts (corrections backend) =====
# Origines autorisees a appeler l API (frontend Angular). Plusieurs valeurs separees par des virgules.
app.cors.allowed-origins=http://localhost:4200

# Dossier ou sont enregistrees les images des articles (servies sur /uploads/**)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Premier compte administrateur, cree au demarrage SEULEMENT si aucun ADMIN n existe
# (a remplir dans TON application.properties ; ne jamais mettre de vrai mot de passe ici)
app.admin.email=
app.admin.password=

# Valeurs de depart du footer (utilisees une seule fois, quand la table parametre_site est vide).
# Ensuite, le webmaster les modifie depuis "Parametres du site". Toutes facultatives.
# Accents : ecrire les caracteres accentues en code \uXXXX (ex. : \u00e9 pour un e accent aigu)
app.site.nom=
app.site.slogan=
app.site.email-contact=
app.site.telephone=
app.site.adresse=
app.site.ville=
app.site.mention-edition=

# ===== E-mails (newsletter) =====
# Developpement : Mailpit (Windows : telecharger mailpit-windows-amd64.zip sur github.com/axllent/mailpit/releases,
# lancer mailpit.exe, boite de reception sur http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.default-encoding=UTF-8
# Production (Brevo) : remplacer par
